server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: teaching-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/edu_submission?stringtype=unspecified}
    username: ${DB_USERNAME:edu_app}
    password: ${DB_PASSWORD:change-me-postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:16}
      minimum-idle: 2
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:100MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:110MB}

mybatis-plus:
  type-handlers-package: com.edu.submission.shared.mybatis
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: input

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-random-secret-at-least-32-characters}
    issuer: edu-submission
    access-token-minutes: 15
    refresh-token-days: 7
    refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:false}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:8088}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:edu_minio}
    secret-key: ${STORAGE_SECRET_KEY:change-me-minio-password}
    bucket: ${STORAGE_BUCKET:edu-submission}
    region: ${STORAGE_REGION:us-east-1}
  demo-data: ${APP_DEMO_DATA:true}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.edu.submission: INFO

