# NOTE: requirements.txt is the single source of truth for the build image
# (see engine/Dockerfile: pip install -r requirements.txt).  The `dependencies`
# list below is kept in sync with requirements.txt to avoid drift.
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "edu-check-engine"
version = "0.1.0"
description = "Text and source-code originality checking worker"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]==3.2.3",
    "boto3==1.35.70",
    "pypdf==5.1.0",
    "python-docx==1.1.2",
]

[project.optional-dependencies]
worker = ["psycopg[binary]==3.2.3", "boto3==1.35.70", "pypdf==5.1.0", "python-docx==1.1.2"]

[project.scripts]
edu-check-worker = "checker.worker:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["checker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
